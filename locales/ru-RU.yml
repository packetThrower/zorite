    notebooks: "Каждый блокнот - это самодостаточная папка, со своей базой знаний, настройками и файлами. Переключение блокнотов перезапускает Zorite в папке блокнота; удаление блокнота только удалит его из списка блокнотов, файлы останутся нетронутыми. В низу панели - список-переключатель блокнотов."
    data_location: "Где текущий блокнот хранит базу знаний, настройки и файлы. При переносе данные будут перенесены, затем Zorite откроется из новой папки."
