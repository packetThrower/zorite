    remember_window: "Восстановление позиции окна и набор открытых вкладок Zorite при открытии. Если разрешение было изменено, то окно выведется по центру экрана."
    date_format: "В каком формате выводить /date и подстановку {{date}}. Не влияет на заголовки дней журнала."
    time_format: "В каком формате заменять /time и подстановку {{time}}."
    app_theme: "Выберите одну из встроенных тем или свою тему."
    appearance: "Тёмный или светлый вариант активной темы. Подстраивается под системные настройки."
    font: "Шрифт, используемый в интерфейсе приложения и заметках. По умолчанию - шрифт активной темы, если найден. Добавьте свои файлы шрифтов в формате .ttf или .otf."
    text_size: "Размер шрифта при чтении и редактировании. Заголовки и встроенные блоки адаптируются к указанному размеру."
    line_numbers: "Вывести номера строк слева от текста на страницах и в днях журнала — по логическим строкам, свёрнутый текст считается как одна строка. В режиме чтения не выводится."
    mouse_cursor: "Курсор мыши в Zorite. Добавьте папку с темой XCursor (формат курсорных тем Linux), чтобы использовать собственную."
    sidebar_position: "При включении панель (список страниц, поиск) закрепляется у правого края окна; при выключении — остаётся слева."
    installed_themes: "Поместите файлы тем .json в папку тем, затем нажмите «Перезагрузить». Любой не указанный цвет берётся из базовой палитры."
    pdf_quality: "Чем выше значение, тем качественней картинки, но медленнее генерация. Для более слабых машин понижайте значения. 100% = исходное разрешение вашего дисплея. 100% — совпадает с разрешением вашего дисплея."
    wysiwyg: "При вклчении форматирование (полужирный, заголовки, ссылки) показывается прямо при вводе. При выключении — редактирование в обычном Markdown, предпросмотр страницы по Esc."
    list_indent: "Отступы на каждый уровень вложенности при Tab и во вложенных списках. Редактирование и просмотр используют одно значение, для одинакового отображения."
    autolink: "Ввод текста, совпадающего с заголовком существующей страницы, обернёт его в [[wiki-ссылку]] по завершении. Отмена (Undo) удалит ссылку."
    application: "Глобальные комбинации клавиш. ⌘ на macOS, Ctrl на Windows и Linux."
    editing: "Слэш-меню и текстовые команды, пока курсор внутри заметки."
