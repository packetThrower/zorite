  desc:
    notebooks: "Each notebook is a self-contained folder - its own database, settings, and attachments. Switching relaunches Zorite into the picked notebook; removing one only forgets it here, never touching its files. The chip at the bottom of the sidebar is the quick switcher."
    data_location: "Where the current notebook keeps its database, settings, and attachments. Moving relocates the data to the new folder, then reopens Zorite."
    unused_images: "Delete images in the managed store that no note, whiteboard, or template references. Files added in the last hour are kept."
    language: "The interface language. Auto follows your system locale; English is always available."
    remember_window: "Reopen Zorite the way you left it: the window's size and position (centered if its display is gone), and optionally the tabs you had open."
    date_format: "How /date and the {{date}} template placeholder are inserted. Journal day headers are unaffected."
    time_format: "How /time and the {{time}} template placeholder are inserted."
    app_theme: "Pick a built-in theme or one of your own."
    appearance: "Light or dark variant of the active theme. Auto follows your system."
    font: "The typeface for the app and your notes. Default follows the active theme's font, if it names one. Add a .ttf or .otf file to use a font that isn't installed on your system."
    text_size: "Size of note text when editing and reading. Headings and inline math scale with it."
    line_numbers: "Show a numbered gutter beside the editor on pages and journal days - logical source lines, wrapped text counts once. The reading view stays clean."
    mouse_cursor: "The pointer inside Zorite. Add any XCursor theme folder (the Linux cursor-theme format) to use your own."
    installed_themes: "Drop .json theme files in your themes folder, then Reload. Any color you omit falls back to the base palette."
    pdf_quality: "Higher is sharper but slower; lower speeds up rendering on slower machines. 100% = your display's native resolution."
    wysiwyg: "On shows formatting (bold, headings, links) inline as you type. Off edits plain Markdown and shows the rendered page on Esc."
    list_indent: "Spaces per nesting level for Tab and bullet nesting. Editing and the rendered view use the same width, so they line up."
    autolink: "Typing a word or phrase that matches an existing page's title wraps it as a [[wiki-link]] when you finish the word. Undo reverts a wrap."
    application: "App-wide commands - they work anywhere. ⌘ on macOS, Ctrl on Windows and Linux."
    editing: "The slash menu and text shortcuts, while a note is focused."
    wb_tools: "Press a letter to pick a tool while a board is focused."
    wb_editing: "Acting on the selection while a board is focused."
    pdf_viewer: "While a PDF tab is focused."
    password: "Encrypt the database with a password (SQLCipher). Zorite asks for it at launch; without it the file on disk is unreadable. A forgotten password is unrecoverable."
    remember_device: "Keep the password in the system keychain and unlock automatically at launch. The idle auto-lock always requires typing it again."
    remember_device_linux: "Keep the password in the kernel keyring and unlock automatically at launch. On Linux this lasts until reboot; the idle auto-lock always requires typing it again."
    autolock: "Lock Zorite after this much inactivity, requiring the password to continue."
    updates: "Zorite checks GitHub for newer releases at startup. It never installs automatically - you review and download from the release page."
    auto_check: "Check for a newer version each time Zorite starts."
    prereleases: "Also offer beta builds (vX.Y.Z-beta.N), not just stable releases."
